---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karpenter
  namespace: karpenter
  # Annotations are ONLY needed for IRSA mode (not for Pod Identity)
  # Uncomment the annotation below if using IRSA mode:
  # annotations:
  #   eks.amazonaws.com/role-arn: >
  #     arn:aws:iam::ACCOUNT_ID:role/NAME-karpenter-controller-irsa

  # For Pod Identity mode: No annotations needed!
  # The association is created by Terraform using the
  # aws_eks_pod_identity_association resource
  # Get the role ARN from: terraform output karpenter_controller_role_arn
