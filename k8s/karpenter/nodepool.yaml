apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  # Template for nodes launched by this NodePool
  template:
    metadata:
      labels:
        # Custom labels for nodes
        workload-type: general
    spec:
      # Node class reference
      nodeClassRef:
        name: default
      
      # Requirements for node selection
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["small", "medium", "large"]
      
      # Taints for nodes (optional)
      taints: []
      
      # Startup taints (removed after node is ready)
      startupTaints:
        - key: node.kubernetes.io/not-ready
          effect: NoSchedule
  
  # Limits for this NodePool
  limits:
    cpu: "100"
    memory: 200Gi
  
  # Disruption budget
  disruption:
    # Consolidation settings
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 30s
    
    # Budget for disruptions
    budgets:
      - nodes: "10%"
  
  # Weight for scheduling preference
  weight: 10
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # AMI selection
  amiFamily: AL2
  
  # Subnet selector - Karpenter will use subnets tagged with karpenter.sh/discovery
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: todo-app-cluster
  
  # Security group selector
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: todo-app-cluster
  
  # IAM instance profile
  role: todo-app-cluster-karpenter-node
  
  # User data for node initialization
  userData: |
    #!/bin/bash
    /etc/eks/bootstrap.sh todo-app-cluster
  
  # Block device mappings
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true
  
  # Metadata options
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  
  # Tags for instances
  tags:
    Name: karpenter-node
    ManagedBy: karpenter
    Environment: production
    Project: todo-app
