# Instructions to install AWS Load Balancer Controller
# This is a reference file - install using Helm

# 1. Create IAM policy for the controller
# Download the policy:
# curl -o iam_policy.json https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/v2.6.2/docs/install/iam_policy.json

# Create the policy:
# aws iam create-policy \
#   --policy-name AWSLoadBalancerControllerIAMPolicy \
#   --policy-document file://iam_policy.json

# 2. Create IAM role and service account
# eksctl create iamserviceaccount \
#   --cluster=todo-app-cluster \
#   --namespace=kube-system \
#   --name=aws-load-balancer-controller \
#   --attach-policy-arn=arn:aws:iam::ACCOUNT_ID:policy/AWSLoadBalancerControllerIAMPolicy \
#   --override-existing-serviceaccounts \
#   --approve

# 3. Install the controller using Helm
# helm repo add eks https://aws.github.io/eks-charts
# helm repo update

# helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#   -n kube-system \
#   --set clusterName=todo-app-cluster \
#   --set serviceAccount.create=false \
#   --set serviceAccount.name=aws-load-balancer-controller

# 4. Verify installation
# kubectl get deployment -n kube-system aws-load-balancer-controller
